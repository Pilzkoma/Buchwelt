<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leftPage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f2efe8"/>
      <stop offset="100%" style="stop-color:#fbf9f4"/>
    </linearGradient>
    <linearGradient id="rightPage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ece9e2"/>
      <stop offset="100%" style="stop-color:#e4e2db"/>
    </linearGradient>
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffddb6"/>
      <stop offset="100%" style="stop-color:#f5c990"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Book with shadow, slightly larger/centered for safe zone -->
  <g filter="url(#shadow)">
    <path d="M230,370 L512,302 L512,736 L230,704 Z" fill="url(#leftPage)"/>
    <path d="M512,302 L794,370 L794,704 L512,736 Z" fill="url(#rightPage)"/>
  </g>

