<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" style="stop-color:#061d32"/>
      <stop offset="100%" style="stop-color:#03192e"/>
    </linearGradient>
    <linearGradient id="leftPage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f2efe8"/>
      <stop offset="100%" style="stop-color:#fbf9f4"/>
    </linearGradient>
    <linearGradient id="rightPage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ece9e2"/>
      <stop offset="100%" style="stop-color:#e4e2db"/>
    </linearGradient>
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffddb6"/>
      <stop offset="100%" style="stop-color:#f5c990"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="pageShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow at top -->
  <radialGradient id="innerGlow" cx="50%" cy="20%" r="55%">
    <stop offset="0%" style="stop-color:#0d2d4a;stop-opacity:1"/>
    <stop offset="100%" style="stop-color:#03192e;stop-opacity:0"/>
  </radialGradient>
  <rect width="1024" height="1024" rx="224" fill="url(#innerGlow)"/>

  <!-- Book drop shadow -->
  <g filter="url(#shadow)">
    <!-- Left page: trapezoid, spine taller than outer edge -->
    <path d="M204,356 L512,288 L512,724 L204,692 Z" fill="url(#leftPage)"/>
    <!-- Right page -->
    <path d="M512,288 L820,356 L820,692 L512,724 Z" fill="url(#rightPage)"/>
  </g>

  <!-- Spine highlight -->
  <line x1="512" y1="288" x2="512" y2="724" stroke="#d8d5ce" stroke-width="3" opacity="0.6"/>

  <!-- Left page text lines -->
  <!-- Chapter heading block -->
  <rect x="248" y="358" width="180" height="22" rx="6" fill="#03192e" opacity="0.10"/>
  <rect x="248" y="390" width="130" height="14" rx="5" fill="#03192e" opacity="0.07"/>

  <!-- Body text lines -->
  <rect x="248" y="430" width="228" height="11" rx="5" fill="#556477" opacity="0.22"/>
  <rect x="248" y="455" width="210" height="11" rx="5" fill="#556477" opacity="0.22"/>
  <rect x="248" y="480" width="222" height="11" rx="5" fill="#556477" opacity="0.22"/>
  <rect x="248" y="505" width="198" height="11" rx="5" fill="#556477" opacity="0.22"/>
  <rect x="248" y="530" width="218" height="11" rx="5" fill="#556477" opacity="0.22"/>
  <rect x="248" y="555" width="185" height="11" rx="5" fill="#556477" opacity="0.22"/>
  <rect x="248" y="580" width="205" height="11" rx="5" fill="#556477" opacity="0.22"/>
  <rect x="248" y="605" width="160" height="11" rx="5" fill="#556477" opacity="0.22"/>

  <!-- Right page text lines -->
  <rect x="556" y="430" width="218" height="11" rx="5" fill="#556477" opacity="0.17"/>
  <rect x="556" y="455" width="200" height="11" rx="5" fill="#556477" opacity="0.17"/>
  <rect x="556" y="480" width="212" height="11" rx="5" fill="#556477" opacity="0.17"/>
  <rect x="556" y="505" width="188" height="11" rx="5" fill="#556477" opacity="0.17"/>
  <rect x="556" y="530" width="210" height="11" rx="5" fill="#556477" opacity="0.17"/>
  <rect x="556" y="555" width="178" height="11" rx="5" fill="#556477" opacity="0.17"/>
  <rect x="556" y="580" width="198" height="11" rx="5" fill="#556477" opacity="0.17"/>
  <rect x="556" y="605" width="155" height="11" rx="5" fill="#556477" opacity="0.17"/>

  <!-- Amber bookmark ribbon -->
  <!-- Placed on right page, near spine side -->
  <path d="M714,356 L714,546 L692,526 L670,546 L670,356 Z" fill="url(#bookmarkGrad)"/>
  <!-- Bookmark inner line for depth -->
  <line x1="670" y1="356" x2="670" y2="546" stroke="#e8c090" stroke-width="1.5" opacity="0.5"/>

  <!-- Subtle bottom spine curve -->
  <path d="M490,720 Q512,734 534,720" stroke="#c8c5be" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
